schema_version: 1
name: wsl_pilot
seed: 20261013
repetitions: 10
blocks: 10
backends: [wsl-process, docker-desktop]
workloads: [cpu, memory, disk, network]
interference: [none, matched]
resources:
  target_cpus: 2
  target_memory_mb: 1024
  interference_cpus: 2
  interference_memory_mb: 512
trial:
  warmup_seconds: 5
  measure_seconds: 30
  cooldown_seconds: 5
  timeout_seconds: 90
sampling:
  enabled: true
  interval_ms: 250
disk:
  path: /home/atharva/vtrace/scratch
  size_mb: 512
  block_size: 4k
  rw: randrw
  direct: true
  depth: 1
network:
  endpoint: 127.0.0.1
  port: 15201
  topology: loopback-in-backend-namespace
  managed_server: true
docker_image: vtrace-bench:local
max_duration_seconds: 14400
output:
  root: runs
